<!DOCTYPE html>
<html lang="zh-Hant">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#0A0A0A" />
  <meta name="robots" content="noindex, nofollow" />
  <title>下三路分享教學｜10分鐘輕鬆上手</title>
  <meta name="description" content="下三路分享教學，10 分鐘輕鬆上手。YouTube 實戰影片每月更新，立即點我觀看。" />
  <style>
    /* ============ Reset & Base ============ */
    *,
    *::before,
    *::after {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    html {
      -webkit-text-size-adjust: 100%;
    }

    body {
      font-family: "PingFang TC", "Microsoft JhengHei", "Noto Sans TC", system-ui, -apple-system, sans-serif;
      background: #050505;
      color: #FFFFFF;
      line-height: 1.7;
      overflow-x: hidden;
      -webkit-font-smoothing: antialiased;
    }

    img {
      display: block;
      max-width: 100%;
      height: auto;
    }

    a {
      color: inherit;
      text-decoration: none;
    }

    /* ============ Design Tokens ============ */
    :root {
      --bg: #0A0A0A;
      --gold: #D4AF37;
      --gold-bright: #F5D061;
      --red: #C8102E;
      --text: #FFFFFF;
    }

    /* ============ Container (置中、手機版式) ============ */
    .page {
      max-width: 480px;
      margin: 0 auto;
      position: relative;
      overflow: hidden;
    }

    /* ============ 單屏 STAGE ============ */
    .stage {
      position: relative;
      width: 100%;
      min-height: 100vh;
      min-height: 100dvh;
      background-image: url("images/background.png");
      background-size: cover;
      background-position: center;
      background-repeat: no-repeat;
      display: flex;
      flex-direction: column;
      align-items: center;
      overflow: hidden;
      /* 上：留標題/人物空間；下：避開瀏覽器底欄 */
      padding: clamp(0px, 0vh, 20px) 0 calc(clamp(8px, 2vh, 18px) + env(safe-area-inset-bottom));
    }

    /* ---- 背景往上飄的光暈（在背景圖之上、人物/文字之下） ---- */
    .glow-field {
      position: absolute;
      inset: 0;
      z-index: 0;
      overflow: hidden;
      pointer-events: none;
    }

    .orb {
      position: absolute;
      bottom: -14%;
      border-radius: 50%;
      mix-blend-mode: screen;
      will-change: transform, opacity;
      animation-name: rise;
      animation-timing-function: linear;
      animation-iteration-count: infinite;
    }

    @keyframes rise {
      0% {
        transform: translateY(0) scale(0.75);
        opacity: 0;
      }

      12% {
        opacity: var(--o, 0.7);
      }

      85% {
        opacity: var(--o, 0.7);
      }

      100% {
        transform: translateY(-118vh) scale(1.15);
        opacity: 0;
      }
    }

    /* ---- 上半：人物 + 左上標題 重疊區 ---- */
    .stage__top {
      position: relative;
      width: 100%;
      flex: 1 1 auto;
      min-height: 0;
      display: flex;
      justify-content: flex-end;
      z-index: 1;
    }

    /* 人物：靠右、對齊頂部 */
    .stage__people {
      width: 100%;
      max-width: 380px;
      align-self: flex-start;
      object-fit: contain;
      object-position: top right;
      filter: drop-shadow(0 6px 22px rgba(0, 0, 0, 0.5));
    }

    /* 左上標題：絕對定位，疊在人物前 */
    .stage__title-top {
      position: absolute;
      top: clamp(20px, 1.5vh, 18px);
      left: clamp(8px, 3vw, 20px);
      width: 50%;
      max-width: 220px;
      z-index: 3;
      animation: breathing 1.8s ease-in-out infinite;
      transform-origin: left center;
      will-change: transform;
      filter: drop-shadow(0 3px 10px rgba(0, 0, 0, 0.45));
    }

    /* ---- 下半：title002 + 按鈕 + 圖示 ---- */
    .stage__bottom {
      position: absolute;
      top: clamp(40%, 1.5vh, 18px);
      z-index: 2;
      width: 100%;
      flex: 0 0 auto;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: clamp(8px, 2vh, 18px);
      padding: 0 0px;
      margin-top: clamp(4px, 1.5vh, 14px);
    }

    .stage__title-sub {
      width: 100%;
      max-width: 400px;
      animation: breathing 1.8s ease-in-out infinite;
      transform-origin: center;
      will-change: transform;
    }

    /* CTA 按鈕 */
    .stage__cta {
      display: block;
      width: 75%;
      max-width: 360px;
      cursor: pointer;
      transition: transform 0.2s ease, filter 0.2s ease;
      animation: breathing02 1.1s ease-in-out infinite;
      transform-origin: center;
      will-change: transform;
      filter: drop-shadow(0 6px 16px rgba(200, 16, 46, 0.45));
    }

    .stage__cta:hover {
      transform: translateY(-2px) scale(1.02);
      filter: brightness(1.08) drop-shadow(0 8px 20px rgba(200, 16, 46, 0.6));
    }

    .stage__cta:active {
      transform: translateY(0) scale(0.97);
    }

    /* 底部圖示列 */
    .stage__icons {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: clamp(16px, 6vw, 28px);
      margin-top: clamp(2px, 1vh, 8px);
    }

    .stage__icons a {
      display: block;
      transition: transform 0.18s ease, filter 0.18s ease;
    }

    .stage__icons a:hover {
      transform: translateY(-2px) scale(1.08);
      filter: brightness(1.1);
    }

    .stage__icons a:active {
      transform: scale(0.94);
    }

    .stage__icons img {
      width: clamp(34px, 9vw, 44px);
      height: auto;
      filter: drop-shadow(0 3px 8px rgba(0, 0, 0, 0.5));
    }

    /* ============ Animations ============ */
    @keyframes breathing {

      0%,
      100% {
        transform: scale(1);
      }

      50% {
        transform: scale(1.05);
      }
    }

    @keyframes breathing02 {

      0%,
      100% {
        transform: scale(1);
      }

      50% {
        transform: scale(1.05);
      }
    }

    @media (prefers-reduced-motion: reduce) {

      .stage__title-top,
      .stage__title-sub,
      .stage__cta {
        animation: none;
      }

      .orb {
        animation: none !important;
      }
    }

    /* ============ PC / Tablet RWD ============ */
    @media (min-width: 481px) {
      body {
        /* PC 上背景延伸、容器置中呈現手機版式 */
        background:
          radial-gradient(ellipse at top, rgba(212, 175, 55, 0.12) 0%, transparent 60%),
          #050505;
      }

      .page {
        box-shadow: 0 0 60px rgba(0, 0, 0, 0.85);
      }
    }
  </style>
</head>

<body>

  <main class="page">
    <section class="stage" aria-label="下三路分享教學">

      <!-- 背景往上飄的光暈 -->
      <div class="glow-field" aria-hidden="true"></div>

      <!-- 上半：人物 + 左上標題 -->
      <div class="stage__top">
        <img class="stage__people" src="images/people001.png" alt="教學示範人物與手機畫面" loading="eager" />
        <img class="stage__title-top" src="images/title001.png" alt="下三路分享教學 10分鐘 輕鬆上手" loading="eager" />
      </div>

      <!-- 下半：標題 + 按鈕 + 圖示 -->
      <div class="stage__bottom">
        <img class="stage__title-sub" src="images/title002.png" alt="Youtube 實戰影片每月更新" loading="eager" />

        <a class="stage__cta" href="#" aria-label="點我觀看">
          <img src="images/button001.png" alt="點我觀看" />
        </a>

        <div class="stage__icons" aria-label="社群連結">
          <a href="#" aria-label="LINE">
            <img src="images/icon001_line.png" alt="LINE" />
          </a>
          <a href="#" aria-label="YouTube">
            <img src="images/icon002_youtube.png" alt="YouTube" />
          </a>
        </div>
      </div>

    </section>
  </main>

  <script>
    // 隨機生成往上飄的光暈光點（動畫由 CSS @keyframes rise 負責）
    (function () {
      var field = document.querySelector('.glow-field');
      if (!field) return;

      var COUNT = 40;
      var TINTS = [
        '245, 208, 97',   // 金
        '255, 233, 170',  // 淺金
        '212, 175, 55',   // 深金
        '255, 224, 150',  // 暖金
        '255, 245, 205'   // 米白光
      ];
      var reduce = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
      var frag = document.createDocumentFragment();

      for (var i = 0; i < COUNT; i++) {
        var orb = document.createElement('span');
        orb.className = 'orb';

        var size = 6 + Math.random() * 50;                 // 6 ~ 56px
        var tint = TINTS[(Math.random() * TINTS.length) | 0];
        var op = (0.30 + Math.random() * 0.55).toFixed(2); // 0.30 ~ 0.85
        var dur = (6 + Math.random() * 10).toFixed(2);     // 6 ~ 16s

        orb.style.left = (Math.random() * 100).toFixed(2) + '%';
        orb.style.width = size.toFixed(1) + 'px';
        orb.style.height = size.toFixed(1) + 'px';
        orb.style.background =
          'radial-gradient(circle, rgba(' + tint + ',' + op + ') 0%, rgba(' + tint + ',0) 70%)';
        orb.style.filter = 'blur(' + (0.5 + Math.random() * 2.5).toFixed(1) + 'px)';
        orb.style.setProperty('--o', op);

        if (reduce) {
          // 不播放動畫時，靜態散落在畫面各處當柔光
          orb.style.bottom = 'auto';
          orb.style.top = (Math.random() * 95).toFixed(1) + '%';
          orb.style.opacity = (op * 0.6).toFixed(2);
        } else {
          orb.style.animationDuration = dur + 's';
          orb.style.animationDelay = (-Math.random() * dur).toFixed(2) + 's';
        }

        frag.appendChild(orb);
      }
      field.appendChild(frag);
    })();
  </script>

</body>

</html>
